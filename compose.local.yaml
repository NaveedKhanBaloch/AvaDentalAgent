# Dependencies for native uvicorn/Next.js development; separate from other projects.
name: avadental-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dentalvoice
      POSTGRES_USER: dentalvoice
      POSTGRES_PASSWORD: supersecret
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalvoice -d dentalvoice"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
