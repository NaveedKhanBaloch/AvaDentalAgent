[project]
name = "dentalvoice-api"
version = "0.1.0"
description = "DentalVoice AI backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.7.1",
  "redis>=5.0.8",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.4.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "black>=24.8.0",
  "httpx>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.api.v1",
  "app.api.v1.routes",
  "app.core",
  "app.db",
  "app.models",
  "app.workers",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
