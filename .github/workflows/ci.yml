name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: dentalvoice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d dentalvoice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test_user:synthetic-ci-password@localhost:5432/dentalvoice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run backend tests
        run: |
          cd apps/api
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci
      - name: Build frontend
        run: |
          cd apps/web
          npm run build
